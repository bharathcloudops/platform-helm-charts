#==============================================================================
# UNPRIVILEGED SHARED CHART VALIDATION
#==============================================================================
name: 01 - Validate Helm Charts
#==============================================================================
# VALIDATION TRIGGERS AND READ-ONLY EXECUTION
#==============================================================================
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
#==============================================================================
# CANCEL SUPERSEDED RUNS FOR THE SAME REF
#==============================================================================
concurrency:
  group: charts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  #============================================================================
  # OFFLINE CHART RENDERING AND SECURITY CONTRACTS
  #============================================================================
  charts:
    name: 01 - Validate Helm Charts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 01 - Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 02 - Install Pinned Helm
        run: bash scripts/install-ci-tools.sh
      - name: 03 - Validate Templates and Security Contracts
        run: bash scripts/validate.sh
  #============================================================================
  # SHARED SHELL CHECKS FROM AN IMMUTABLE TEMPLATE REVISION
  #============================================================================
  shell:
    name: 02 - Validate Shell Scripts
    uses: bharathcloudops/github-pipeline-templates/.github/workflows/shell-validate.yml@v0.9.9
    with:
      template_ref: v0.9.4
  #============================================================================
  # DISPOSABLE LOCAL CLUSTER - NO PRODUCTION ACCESS
  #============================================================================
  runtime:
    name: 03 - Validate Isolated Runtime
    needs: charts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 01 - Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 02 - Install Pinned Helm and Kind
        run: bash scripts/install-ci-tools.sh
      - name: 03 - Verify Workloads and Storage
        run: bash scripts/smoke-kind.sh