#==============================================================================
# WORDPRESS APPLICATION DEPLOYMENT
#==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: application
spec:
  replicas: {{ .Values.wordpress.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/component: application
  template:
    metadata:
      annotations:
        checksum/nginx-configuration: {{ include (print $.Template.BasePath "/nginx-configmap.yaml") . | sha256sum }}
        checksum/php-configuration: {{ include (print $.Template.BasePath "/wordpress-php-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: prepare-wordpress-webroot
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}@{{ .Values.wordpress.image.digest }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              chown -R 0:0 /var/www/html /extensions /nginx-cache
              mkdir -p /extensions/themes /extensions/plugins /nginx-cache
              rm -f /var/www/html/wp-config.php
              installed_version=$(php -r 'if (is_readable("/var/www/html/wp-includes/version.php")) { include "/var/www/html/wp-includes/version.php"; echo $wp_version; }')
              image_version=$(php -r 'include "/usr/src/wordpress/wp-includes/version.php"; echo $wp_version;')
              if [ "$installed_version" != "$image_version" ]; then
                tar --create --file - --directory /usr/src/wordpress --exclude=./wp-content --exclude=./wp-config.php . | tar --extract --file - --directory /var/www/html
                find /var/www/html -path /var/www/html/wp-content -prune -o ! -name wp-config.php -exec chmod u+rwX,g+rX,o+rX {} +
                chmod 2775 /var/www/html
              fi
              echo "wordpress_core=$image_version previous=${installed_version:-none}"
              chmod -R u+rwX /var/www/html
              chown -R 33:33 /var/www/html
              if [ -z "$(find /extensions/themes -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
                cp -R /usr/src/wordpress/wp-content/themes/. /extensions/themes/
              fi
              if [ ! -r /extensions/plugins/redis-cache/dependencies/predis/predis/autoload.php ]; then
                rm -rf /extensions/plugins/redis-cache
                cp -R /usr/src/wordpress/wp-content/plugins/redis-cache /extensions/plugins/redis-cache
              fi
              test -r /extensions/plugins/redis-cache/redis-cache.php
              test -r /extensions/plugins/redis-cache/dependencies/predis/predis/autoload.php
              if [ ! -f /extensions/object-cache.php ]; then
                cp /usr/src/wordpress/wp-content/plugins/redis-cache/includes/object-cache.php /extensions/object-cache.php
              fi
              chmod -R u+rwX /extensions
              chown -R 33:33 /extensions
              chown -R 101:101 /nginx-cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: webroot
              mountPath: /var/www/html
            - name: extensions
              mountPath: /extensions
            - name: nginx-cache
              mountPath: /nginx-cache
      containers:
        - name: wordpress
          image: "{{ .Values.wordpress.image.repository }}:{{ .Values.wordpress.image.tag }}@{{ .Values.wordpress.image.digest }}"
          imagePullPolicy: {{ .Values.wordpress.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 33
            runAsNonRoot: true
            runAsUser: 33
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.mariadb.database | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.mariadb.username | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.wordpressDatabasePasswordKey }}
            - name: WORDPRESS_ADMIN_USER
              value: {{ .Values.wordpress.adminUser | quote }}
            - name: WORDPRESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.wordpressAdminPasswordKey }}
            - name: WORDPRESS_ADMIN_EMAIL
              value: {{ .Values.wordpress.adminEmail | quote }}
            - name: WORDPRESS_SITE_TITLE
              value: {{ .Values.wordpress.siteTitle | quote }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                $_SERVER['HTTPS'] = 'on';
                define('WP_HOME', 'https://{{ .Values.ingress.hostname }}');
                define('WP_SITEURL', 'https://{{ .Values.ingress.hostname }}');
                define('DISALLOW_FILE_EDIT', true);
                define('FORCE_SSL_ADMIN', true);
                define('FS_METHOD', 'direct');
                define('WP_MEMORY_LIMIT', '{{ .Values.wordpress.configuration.memoryLimit }}');
                define('WP_MAX_MEMORY_LIMIT', '{{ .Values.wordpress.configuration.maxMemoryLimit }}');
                define('AUTOSAVE_INTERVAL', {{ .Values.wordpress.configuration.autosaveInterval }});
                define('WP_POST_REVISIONS', {{ .Values.wordpress.configuration.postRevisions }});
                define('EMPTY_TRASH_DAYS', {{ .Values.wordpress.configuration.emptyTrashDays }});
                define('DISABLE_WP_CRON', true);
                define('WP_REDIS_CLIENT', 'predis');
                define('WP_REDIS_HOST', 'redis');
                define('WP_REDIS_PORT', 6379);
                define('WP_REDIS_DATABASE', 0);
                define('WP_REDIS_PREFIX', '{{ .Values.ingress.hostname }}:');
                define('WP_REDIS_GRACEFUL', true);
          ports:
            - name: fastcgi
              containerPort: 9000
              protocol: TCP
          resources:
            {{- toYaml .Values.wordpress.resources | nindent 12 }}
          volumeMounts:
            - name: webroot
              mountPath: /var/www/html
            - name: extensions
              mountPath: /var/www/html/wp-content/themes
              subPath: themes
            - name: extensions
              mountPath: /var/www/html/wp-content/plugins
              subPath: plugins
            - name: extensions
              mountPath: /var/www/html/wp-content/object-cache.php
              subPath: object-cache.php
            - name: uploads
              mountPath: /var/www/html/wp-content/uploads
            - name: wordpress-tmp
              mountPath: /tmp
            - name: php-configuration
              mountPath: /usr/local/etc/php/conf.d/wordpress.ini
              subPath: wordpress.ini
              readOnly: true
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}@{{ .Values.nginx.image.digest }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-configuration
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
            - name: webroot
              mountPath: /var/www/html
              readOnly: true
            - name: extensions
              mountPath: /var/www/html/wp-content/themes
              subPath: themes
              readOnly: true
            - name: extensions
              mountPath: /var/www/html/wp-content/plugins
              subPath: plugins
              readOnly: true
            - name: extensions
              mountPath: /var/www/html/wp-content/object-cache.php
              subPath: object-cache.php
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: nginx-configuration
          configMap:
            name: wordpress-nginx
        - name: nginx-tmp
          emptyDir: {}
        - name: webroot
          persistentVolumeClaim:
            claimName: wordpress-core
        - name: wordpress-tmp
          emptyDir: {}
        - name: php-configuration
          configMap:
            name: wordpress-php
        - name: extensions
          persistentVolumeClaim:
            claimName: wordpress-extensions
        - name: nginx-cache
          emptyDir:
            sizeLimit: 256Mi
        - name: uploads
          persistentVolumeClaim:
            claimName: wordpress-uploads