#==============================================================================
# WORDPRESS KUBERNETES DEFAULT VALUES
#==============================================================================

nameOverride: wordpress

imagePullSecrets: []

wordpress:
  siteTitle: WordPress
  adminUser: wordpress-admin
  adminEmail: wordpress@example.invalid
  image:
    repository: wordpress
    tag: 7.1.2-php8.5-fpm-alpine
    digest: sha256:93f6949bc4060dbc275b3293a12af71206fdbdb4ec87369b49b19311313cc5e3
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 80
  persistence:
    storageClass: ""
    size: 15Gi
    coreSize: 5Gi
    extensionsSize: 5Gi
  configuration:
    memoryLimit: 256M
    maxMemoryLimit: 512M
    autosaveInterval: 120
    postRevisions: 10
    emptyTrashDays: 14
  php:
    maxExecutionTime: 300
    maxInputTime: 300
    maxInputVars: 5000
    memoryLimit: 512M
    opcacheInternedStringsBuffer: 16
    opcacheMaxAcceleratedFiles: 20000
    opcacheMemoryConsumption: 192
    postMaxSize: 128M
    uploadMaxFilesize: 128M
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 768Mi

nginx:
  clientMaxBodySize: 128m
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.30.6-alpine-slim
    digest: sha256:5d8bb9437d74a600ec5dbf90c035451c724dc33eac8d3a71078f6f8612c345f6
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

redis:
  image:
    repository: redis
    tag: 8.2.10-alpine
    digest: sha256:d1389b3f3f981460b9b0918c4d7390c6e9decb8c69b9f09a02e1b6fd7554ade7
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi

cron:
  schedule: "*/5 * * * *"

mariadb:
  image:
    repository: mariadb
    tag: 12.3.3
    digest: sha256:99c125f103f5d081ebbc9ffe064e63daf7f688ac33a5f7f29af2d7260a96debf
    pullPolicy: IfNotPresent
  database: wordpress
  username: wordpress
  persistence:
    storageClass: ""
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

secrets:
  existingSecret: wordpress-secrets
  wordpressDatabasePasswordKey: wordpress-database-password
  mariadbRootPasswordKey: mariadb-root-password
  wordpressAdminPasswordKey: wordpress-admin-password

ingress:
  enabled: true
  className: traefik
  hostname: wordpress.example.invalid
  annotations: {}

backup:
  enabled: false
  tag: wordpress
  schedule: "17 2 * * *"
  secretName: wordpress-backup-secrets
  image:
    repository: restic/restic
    tag: 0.19.1
    digest: sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  retention:
    daily: 7
    weekly: 4
    monthly: 6
  restore:
    enabled: false
    id: ""
    snapshot: latest
  verify:
    enabled: false
    snapshot: latest
    id: manual

podSecurityContext:
  fsGroup: 33
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault